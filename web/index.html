    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generator SEPA EPC QR, HUB3 PDF417 i EIP-681 wallet QR barkodova za hrvatska plaćanja i Monerium / Gnosis EURe most.">
  <meta name="theme-color" content="#002F6C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pay.DOMOVINA.ai">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>pay.DOMOVINA.ai — generator platnih barkodova</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Auto-refresh on new deploy: when a new service worker takes control
    // of a tab that already had one, reload so the user sees fresh assets.
    // Pairs with _headers (no-cache on index.html / bootstrap / SW) so the
    // browser actually fetches the new serviceWorkerVersion that triggers
    // the SW update in the first place.
    if ('serviceWorker' in navigator) {
      const hadControllerOnLoad = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadControllerOnLoad || reloading) return;
        reloading = true;
        location.reload();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
