name = "pay-domovina-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "7dc7167b7e2e00923bfa7cd697df14e4"

# Workers Routes — both hostnames map to this single Worker script. The Worker
# is host-agnostic (Hono routes are path-based), so the entire app —
# /api/monerium/webhook, /admin/*, /api/hpb/*, etc — works on either domain.
#
#   monerium.domovina.ai  → Monerium dashboard webhook target (set in 2026-05).
#                           DO NOT change without updating the URL in the
#                           Monerium /webhooks subscription.
#   mpt.domovina.ai       → brand-aligned hostname for the MPT admin UI +
#                           any public API. Same Worker, same data.
#
# DNS for both: proxied A/AAAA records (orange-cloud) on the domovina.ai
# zone, provisioned manually in CF dashboard. Single-level subdomains so
# Universal SSL covers them automatically (multi-level like
# api.pay.domovina.ai would need Advanced Certificate Manager).
[[routes]]
pattern = "monerium.domovina.ai/*"
zone_name = "domovina.ai"

[[routes]]
pattern = "mpt.domovina.ai/*"
zone_name = "domovina.ai"

[observability]
enabled = true

[triggers]
# "*/2" drives the on-chain donation indexer (snappy detection); "0 */6" also
# runs account refresh + expired-intent sweep (gated in the scheduled handler).
crons = ["*/2 * * * *", "0 */6 * * *"]

# D1 — create with: wrangler d1 create pay_domovina
[[d1_databases]]
binding = "DB"
database_name = "pay_domovina"
database_id = "70caf01f-e1fa-4f3d-a23f-ebb80356548d"
migrations_dir = "migrations"

# Durable Object: one SSE hub per payment-intent sid (ADR 0017,
# src/intents/stream.ts). Inert while INTENT_SSE = "0" — nothing ever calls it.
[[durable_objects.bindings]]
name = "INTENT_STREAM"
class_name = "IntentStream"

[[migrations]]
tag = "v1-intent-stream"
new_sqlite_classes = ["IntentStream"]

# KV — create with: wrangler kv namespace create TOKEN_CACHE
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "8b9f1c0c575246e284b8a18157990b38"

[vars]
# Choose: "enable_banking" (default) or "gocardless"
BANKING_PROVIDER = "enable_banking"
ALLOWED_ORIGINS = "https://pay.domovina.ai,https://energy.domovina.ai,https://wallet.domovina.ai,https://wallet-staging.domovina.ai,https://mpt.domovina.ai,https://monerium.domovina.ai,https://domovina.ai,https://www.domovina.ai,https://pinka.io,https://www.pinka.io,https://pinka.finance,https://www.pinka.finance,https://app.pinka.finance,https://pinka-app.pages.dev,https://solardei.hr,https://solardei.domovina.ai,http://localhost:5173,http://localhost:3007"

# Enable Banking
ENABLE_BANKING_BASE_URL = "https://api.enablebanking.com"
ENABLE_BANKING_REDIRECT_URL = "https://monerium.domovina.ai/api/hpb/callback"

# GoCardless (kept for fallback if/when signups reopen)
GOCARDLESS_BASE_URL = "https://bankaccountdata.gocardless.com/api/v2"
GOCARDLESS_REDIRECT_URL = "https://monerium.domovina.ai/api/hpb/callback"

# Monerium — production. Flip to https://api.monerium.dev for sandbox testing.
MONERIUM_BASE_URL = "https://api.monerium.app"
MONERIUM_PROFILE_ID = ""

# otp.domovina.ai — Reverse OTP service for wallet phone binding + recovery.
# Source repo: /Users/ms/git/domovinatv/sms.domovina.ai
OTP_API_BASE = "https://otp.domovina.ai"

# Outbound "intent paid" webhook → pinka.finance (domovina-api edge fn).
# Fires once per intent on the pending→paid flip. Signing = svix/Standard Webhooks
# (same scheme as the inbound Monerium webhook). Secret via:
#   wrangler secret put INTENT_WEBHOOK_SECRET
# Leave URL empty to disable. See backend/src/intents/outbound.ts.
INTENT_WEBHOOK_URL = "https://api.domovina.ai/functions/v1/pinka-webhook"

# Tenant payout whitelist (ADR 0016 — docs/decisions/0016-tenant-payout-whitelist.md).
# The forward rail is FAIL-CLOSED: EURe only leaves the Safe for an address that
# (a) matches the destination of a pre-created intent / registered campaign and
# (b) is on that tenant's whitelist. Everything else parks with status `blocked`.
#
#   DEFAULT_TENANT_ID          — tenant assumed when a caller sends no API key.
#   INTENT_REQUIRE_TENANT_KEY  — "1" makes POST /api/intents demand a tenant key.
#                                Keep "0" until the Flutter app, wallet PWA and
#                                e-demokracija all ship a pk_ key, otherwise
#                                those clients start getting 401.
DEFAULT_TENANT_ID = "italk"
INTENT_REQUIRE_TENANT_KEY = "0"

# Multi-tenant rail (ADR 0017 — docs/decisions/0017-multi-tenant-rail.md).
# Every tenant other than DEFAULT_TENANT_ID has its own Monerium account,
# webhook (/api/monerium/webhook/t/<tenant>) and signer, stored in the
# tenant_rail table with secrets encrypted under TENANT_SECRETS_KEK.
#   MULTI_TENANT_RAIL — "1" turns tenant rails on. "0": per-tenant webhook 404,
#                       intents for non-default tenants refused, reconcile
#                       only touches the default tenant. ITalk never reads it.
#   INTENT_SSE        — "1" serves GET /api/intents/:sid/stream as SSE; "0"
#                       keeps the historical 404 (clients poll).
MULTI_TENANT_RAIL = "0"
INTENT_SSE = "1"

# Stray payment resolver (src/monerium/strayResolver.ts). "1": a SEPA payment
# without a routing reference is matched to the tenant's open/recently expired
# intent of the EXACT same amount; forwarded only when every candidate points
# at the same whitelisted destination. "0": park as no_routing_target (old).
STRAY_RESOLVER = "1"

# /admin prijava (src/admin/auth/mount.ts, docs/admin-auth.md) — isti model kao
# bank-push-gateway: Cloudflare Access (OTP na e-mail) na /admin/sso ili passkey.
# Nisu tajne. Oduzimanje pristupa: makni e-mail odavde (djeluje odmah, i na
# postojeće sesije) i iz Access politike.
#   ADMIN_HOST         — jedini host admina; drugi host preusmjerava (passkey rpID = hostname)
#   ACCESS_TEAM_DOMAIN — Zero Trust tim
#   ACCESS_AUD         — AUD Access aplikacije koja štiti ADMIN_HOST/admin/sso
ADMIN_EMAILS = "stepanic.matija@gmail.com,ms@ff.hr"
ADMIN_HOST = "mpt.domovina.ai"
ACCESS_TEAM_DOMAIN = "domovina.cloudflareaccess.com"
ACCESS_AUD = ""

# MPT routing — Safe + Zodiac Roles Modifier on Gnosis chain (100).
# All public; private signer key lives in ROUTER_PRIVATE_KEY secret below.
GNOSIS_RPC_URL = "https://rpc.gnosischain.com"
EURE_CONTRACT = "0x420CA0f9B9b604cE0fd9C18EF134C705e5Fa3430"
# MPT main-rail Safe (Monerium default wallet). Verified on-chain 2026-05-21:
# Safe v1.4.1, threshold 2/3, owners ms-/ds-/md-mpt-mr-signer.
SAFE_ADDRESS = "0x449aBCEf4e29a7Dd8d98dB451AF2c463561BAf2e"
# Zodiac Roles Modifier v2 instance, owner = SAFE_ADDRESS, enabled as Safe module.
# Verified on-chain 2026-05-21.
ROLES_MODIFIER_ADDRESS = "0x330347d656b1a5DF972f758DE1E25E99ec36762c"
# Bytes32 role key for "EUReForwarder" — formatBytes32String("EUReForwarder").
# Set via safe-tx/001-eure-forwarder-role-setup.{mjs,json}; assigned to backend
# EOA 0xd61289c5035c6e5eaD6F100b6A8F90ac4ee054CB once that batch executes on Safe.
ROLE_KEY = "0x45555265466f7277617264657200000000000000000000000000000000000000"

# PaymentRegistry onchain memo (optional). When BOTH set, the rail forwards
# via Safe MultiSend so each forward emits an onchain `Payment` event in the
# same tx hash as the value transfer. Leave empty to keep the legacy
# single-`transfer` path.
#   PAYMENT_REGISTRY_ADDRESS — fill in after safe-tx/004-deploy-payment-registry
#   MULTISEND_ADDRESS         — Safe MultiSendCallOnly v1.4.1 canonical deploy
PAYMENT_REGISTRY_ADDRESS = ""
MULTISEND_ADDRESS = "0x9641d764fc13c8B624c04430C7356C1C7C8102e2"

# Secrets — set via `wrangler secret put`:
#   ADMIN_TOKEN                     # bearer token for /api/*/admin JSON endpoints
#   ENABLE_BANKING_APPLICATION_ID   # UUID from EnableBanking dashboard
#   ENABLE_BANKING_PRIVATE_KEY      # full PEM PKCS8 (preserve newlines)
#   GOCARDLESS_SECRET_ID            # only needed if BANKING_PROVIDER=gocardless
#   GOCARDLESS_SECRET_KEY
#   MONERIUM_CLIENT_ID              # from monerium.app/developers/apps
#   MONERIUM_CLIENT_SECRET
#   MONERIUM_WEBHOOK_SECRET         # HMAC secret you set in Monerium webhook config
#   ROUTER_PRIVATE_KEY              # 0x-prefixed 32-byte hex — backend EOA member of EUReForwarder role
#   PHONE_PEPPER                    # opaque secret string — HMAC key for hashing E.164 phones in wallet_registry
#   TELEGRAM_BOT_TOKEN              # optional — @BotFather token for blocked-forward alerts
#   TELEGRAM_CHAT_ID                # optional — ops chat id; both unset = alerts degrade to console warnings
#   TENANT_SECRETS_KEK              # base64 of 32 random bytes (openssl rand -base64 32) — AES-GCM key for tenant_rail *_enc (ADR 0017). Losing it = re-onboard every tenant's secrets.
