name = "mpt-shopify"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "7dc7167b7e2e00923bfa7cd697df14e4"

# Single-level subdomain so Universal SSL covers it (see backend/wrangler.toml).
# DNS: proxied record on the domovina.ai zone, created on first deploy.
[[routes]]
pattern = "mpt-shopify.domovina.ai"
custom_domain = true

[triggers]
crons = ["*/2 * * * *"]

# wrangler d1 create mpt_shopify → paste the id here
[[d1_databases]]
binding = "DB"
database_name = "mpt_shopify"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[vars]
APP_URL = "https://mpt-shopify.domovina.ai"
MPT_API_BASE = "https://mpt.domovina.ai"
# Optional shared (unlisted public) app. Leave empty when every merchant has
# its own custom-distribution app, registered with PUT /admin/apps/<client_id>.
SHOPIFY_API_KEY = ""
SHOPIFY_SCOPES = "read_orders,write_orders"
SHOPIFY_API_VERSION = "2026-07"

# Secrets (wrangler secret put <NAME>):
#   SHOPIFY_API_SECRET  — only with SHOPIFY_API_KEY: the shared app's client secret.
#                         Per-merchant app secrets live in D1 (apps table, encrypted).
#   TOKEN_KEK           — openssl rand -base64 32   (AES-GCM for D1 secrets)
#   SID_SECRET          — openssl rand -base64 32   (intent sid derivation; NEVER rotate:
#                         a new key re-derives different sids for existing orders)
#   ADMIN_TOKEN         — openssl rand -base64 32   (operator /admin/* bearer)

[observability]
enabled = true

# ── Standalone worker for one merchant (optional) ───────────────────────────
# Same code, own domain + D1 + secrets, so a breach of one merchant's worker
# exposes nothing of another. Route/vars/D1/crons are not inherited by envs —
# repeat them. Put the merchant's app in SHOPIFY_API_KEY/SECRET (the "shared"
# app of this worker); /admin/apps stays empty. Then:
#   wrangler d1 create mpt_shopify_<slug>
#   wrangler d1 migrations apply mpt_shopify_<slug> --remote --env <slug>
#   wrangler secret put SHOPIFY_API_SECRET|TOKEN_KEK|SID_SECRET|ADMIN_TOKEN --env <slug>
#   wrangler deploy --env <slug>
# and on the Shopify side: scripts/new-merchant-app.sh <slug> <client_id>
#   --worker-url https://mpt-shopify-<slug>.domovina.ai
#
# [env.croatisimo]
# name = "mpt-shopify-croatisimo"
# routes = [{ pattern = "mpt-shopify-croatisimo.domovina.ai", custom_domain = true }]
# triggers = { crons = ["*/2 * * * *"] }
# d1_databases = [{ binding = "DB", database_name = "mpt_shopify_croatisimo", database_id = "…", migrations_dir = "migrations" }]
# [env.croatisimo.vars]
# APP_URL = "https://mpt-shopify-croatisimo.domovina.ai"
# MPT_API_BASE = "https://mpt.domovina.ai"
# SHOPIFY_API_KEY = "<client id>"
# SHOPIFY_SCOPES = "read_orders,write_orders"
# SHOPIFY_API_VERSION = "2026-07"
